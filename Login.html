<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Senergy Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-slate-100 flex items-center justify-center min-h-screen font-sans">

    <div class="w-full max-w-md p-8 bg-[#1e293b] rounded-2xl shadow-2xl border border-slate-700/60 mx-4">
        <!-- Logo & Header -->
        <div class="flex items-center justify-center space-x-3 mb-8">
            <div class="p-3 bg-blue-600/20 rounded-xl border border-blue-500/30 text-blue-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-wider text-blue-400">senergy</h1>
                <p class="text-xs text-slate-400">Hệ thống giám sát biến tần</p>
            </div>
        </div>

        <!-- Form Đăng Nhập (Để trống sạch sẽ) -->
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Tên đăng nhập (MemberID)</label>
                <input type="text" id="memberId" placeholder="Nhập tên đăng nhập của bạn" required
                    class="w-full px-4 py-3 bg-[#0f172a] border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-100 text-sm transition">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Mật khẩu</label>
                <input type="password" id="password" placeholder="••••••••" required
                    class="w-full px-4 py-3 bg-[#0f172a] border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-100 text-sm transition">
            </div>

            <div class="flex items-center justify-between text-sm py-1">
                <label class="flex items-center text-slate-300 cursor-pointer">
                    <input type="checkbox" id="remember" checked class="w-4 h-4 rounded bg-[#0f172a] border-slate-700 text-blue-600 focus:ring-blue-500">
                    <span class="ml-2 text-xs">Nhớ tài khoản</span>
                </label>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl transition duration-200 shadow-lg shadow-blue-600/30 text-sm tracking-wide">
                Truy Cập Hệ Thống
            </button>
            
            <p id="errorMsg" class="text-red-400 text-xs text-center hidden pt-2"></p>
        </form>
    </div>

    <script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    
    // Khóa nút và hiện trạng thái đang xử lý
    btn.textContent = "Đang xác thực...";
    btn.disabled = true;
    errorMsg.classList.add('hidden');

    try {
        const workerUrl = 'https://view.solarvn.workers.dev/api/user-login';

        const response = await fetch(workerUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                memberId: document.getElementById('memberId').value,
                password: document.getElementById('password').value,
                remember: document.getElementById('remember').checked
            })
        });
        
        const result = await response.json();

        // 🛑 BẮT BUỘC CHECK KỸ: Phải có success = true VÀ có token trả về thật
        if (result.success && result.tokenFetched) {
            // Lưu thông tin chuẩn xác
            localStorage.setItem('solar_token', result.tokenFetched);
            localStorage.setItem('solar_member_id', result.memberAutoID);
            
            // Thành công mới cho sang trang chủ
            window.location.href = 'index.html'; 
        } else {
            // ❌ Nếu sai tài khoản hoặc server hãng báo lỗi thì dừng lại, không cho vào!
            errorMsg.textContent = result.serverData?.message || "Tài khoản hoặc mật khẩu không chính xác!";
            errorMsg.classList.remove('hidden');
            btn.textContent = "Truy Cập Hệ Thống";
            btn.disabled = false; // Mở lại nút để người dùng nhập lại
        }
    } catch (err) {
        // ❌ Lỗi kết nối mạng hoặc lỗi Worker
        errorMsg.textContent = "Không thể kết nối đến máy chủ xác thực!";
        errorMsg.classList.remove('hidden');
        btn.textContent = "Truy Cập Hệ Thống";
        btn.disabled = false;
    }
        });
    </script>
</body>
</html>
